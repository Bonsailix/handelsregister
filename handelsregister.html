<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relevation V - Handelsregister</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#fdf1ff;
    --ink-dim:#b8aec2;
    --bg:#121014;
    --bg-panel:#1b171d;
    --bg-panel-2:#221d25;
    --line:#38323b;
    --magenta:#9a3157;
    --orange:#f2701a;
    --gold:#ffb648;
    --cyan:#3f8fe0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 15% -5%, rgba(242,112,26,.07), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  .wrap{max-width:1180px; margin:0 auto; padding:34px 24px 90px;}

  header.hero{
    position:relative; overflow:hidden;
    border:1px solid var(--line);
    padding:26px 32px 30px;
    margin-bottom:38px;
    background:linear-gradient(180deg, #1c0f3c 0%, #4a1a48 30%, #9a3157 56%, #f2701a 82%, #ffb648 100%);
    display:flex; align-items:center; gap:28px; flex-wrap:wrap;
  }
  header.hero .grid{
    position:absolute; left:0; right:0; bottom:0; height:70px;
    background-image:
      linear-gradient(rgba(255,182,72,.35) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,182,72,.35) 1px, transparent 1px);
    background-size:36px 22px;
    -webkit-mask-image:linear-gradient(180deg, transparent, #000 70%);
    mask-image:linear-gradient(180deg, transparent, #000 70%);
    transform:perspective(180px) rotateX(35deg);
    transform-origin:bottom;
    opacity:.5;
  }
  header.hero img{position:relative; z-index:2; width:240px; max-width:40vw; height:auto; filter:drop-shadow(0 6px 18px rgba(0,0,0,.4));}
  header.hero .htext{position:relative; z-index:2;}
  header.hero h1{
    font-family:'Audiowide',sans-serif; font-weight:400; text-transform:uppercase;
    font-size:clamp(24px,3.6vw,38px); margin:0 0 6px; color:#1a0e3a; letter-spacing:.02em;
    text-shadow:0 1px 0 rgba(255,255,255,.25);
  }
  header.hero .sub{
    font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:#2a1258; text-transform:uppercase;
    letter-spacing:.1em; font-weight:600;
  }

  .toolbar{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    margin-bottom:28px; padding-bottom:20px; border-bottom:1px solid var(--line);
  }
  .toolbar input[type="text"]{
    background:var(--bg-panel); border:1px solid var(--line); color:var(--ink);
    font-family:'IBM Plex Mono',monospace; font-size:13px;
    padding:10px 14px; border-radius:3px; flex:1 1 220px; min-width:180px;
  }
  .toolbar input[type="text"]::placeholder{color:var(--ink-dim);}
  .toolbar input[type="text"]:focus{outline:none; border-color:var(--cyan);}
  .filters{display:flex; flex-wrap:wrap; gap:8px;}
  .filters button{
    background:var(--bg-panel); border:1px solid var(--line); color:var(--ink-dim);
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; letter-spacing:.03em; text-transform:uppercase;
    padding:8px 13px; border-radius:999px; cursor:pointer; transition:all .15s ease;
  }
  .filters button:hover{color:var(--ink); border-color:var(--orange);}
  .filters button.active{
    background:var(--bg-panel-2); color:var(--gold); border-color:var(--orange);
  }

  .count{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-dim); margin-bottom:18px;}

  .grid-cards{display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:16px;}
  .card{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:4px;
    padding:20px 20px 18px; position:relative; overflow:hidden;
    transition:border-color .15s ease, transform .15s ease;
  }
  .card:hover{border-color:var(--orange); transform:translateY(-2px);}
  .card::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:linear-gradient(180deg, var(--magenta), var(--orange), var(--gold));
  }
  .card .branche{
    display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10.5px;
    color:var(--cyan); text-transform:uppercase; letter-spacing:.08em;
    border:1px solid var(--line); border-radius:999px; padding:3px 10px; margin-bottom:12px;
  }
  .card h3{
    font-family:'Audiowide',sans-serif; font-weight:400; font-size:17px; margin:0 0 10px;
    color:var(--ink); letter-spacing:.01em; line-height:1.25;
  }
  .card dl{margin:0; display:grid; grid-template-columns:auto 1fr; gap:5px 10px; font-size:13px;}
  .card dt{color:var(--ink-dim); font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.04em; align-self:start; padding-top:1px;}
  .card dd{margin:0; color:#e8dcf5;}
  .card .leistungen{
    margin-top:12px; padding-top:12px; border-top:1px dashed var(--line);
    font-size:13px; line-height:1.5; color:#e8dcf5;
  }
  .card .leistungen strong{color:var(--gold); font-weight:600;}

  .empty{
    text-align:center; padding:60px 20px; color:var(--ink-dim);
    font-family:'IBM Plex Mono',monospace; font-size:13px; display:none;
  }

  footer.doc-footer{
    margin-top:50px; padding-top:20px; border-top:1px solid var(--line);
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-dim);
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;
  }

  @media (max-width:600px){
    header.hero{padding:20px 20px 24px;}
    header.hero img{width:170px;}
  }
</style>
</head>
<body>

<div class="wrap">

  <header class="hero">
    <div class="grid"></div>
    <img src="logo.webp" alt="Relevation V">
    <div class="htext">
      <h1>Handelsregister</h1>
      <div class="sub">Offiziell eingetragene Unternehmen</div>
    </div>
  </header>

  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="🔍 Unternehmen, Inhaber oder Standort suchen…">
  </div>
  <div class="filters" id="filters"></div>

  <div class="count" id="count"></div>
  <div class="grid-cards" id="cards"></div>
  <div class="empty" id="emptyState">Keine Treffer für diese Suche.</div>

  <footer class="doc-footer">
    <span>© Relevation V — Handelsregister</span>
    <span id="totalCount"></span>
  </footer>

</div>

<script>
  const data = [
    {branche:"Tuning", unternehmen:"Bennys Performance", inhaber:"Sven Richter", standort:"9038", telefon:"", leistungen:"Tuning / Werkstattservice"},
    {branche:"Gastronomie", unternehmen:"Restaurant Lotusblüte", inhaber:"-", standort:"6178", telefon:"", leistungen:"Speisen und Getränkeverkauf"},
    {branche:"Fahrzeugbranche", unternehmen:"Bennys Cardealership", inhaber:"-", standort:"9039", telefon:"", leistungen:"Verkauf von Autos"},
    {branche:"Fahrzeugbranche", unternehmen:"Motorrad/LKW Handel", inhaber:"-", standort:"4024", telefon:"9639946", leistungen:"Verkauf von Motorrädern/LKW's"},
    {branche:"Fahrzeugbranche", unternehmen:"Drift Corp.", inhaber:"Tom Janzen", standort:"7175", telefon:"9153058", leistungen:"Verkauf von Driftcars"},
    {branche:"Immobilien", unternehmen:"Baugenossenschaft", inhaber:"Normen Mayer", standort:"7215", telefon:"", leistungen:"Immobilienvermietung / Verkauf"},
    {branche:"Flugschule/Flughandel", unternehmen:"Wings & More", inhaber:"-", standort:"10019", telefon:"", leistungen:"Fluglizenzen / Verkauf Fluggeräte"},
    {branche:"Freizeit", unternehmen:"Tequilala", inhaber:"-", standort:"6185", telefon:"", leistungen:"Bar"},
    {branche:"Versorgung", unternehmen:"Weingut Richter", inhaber:"Aurelia Richter", standort:"5008", telefon:"", leistungen:"Herstellung / Vertrieb von Alkohol"},
    {branche:"Freizeit", unternehmen:"Hookah Lounge", inhaber:"-", standort:"7085", telefon:"", leistungen:"Shishabar mit Zigarrenvertrieb"},
    {branche:"Freizeit", unternehmen:"Flamingo Beachclub", inhaber:"-", standort:"7000", telefon:"", leistungen:"Beachclub"},
    {branche:"Gastronomie", unternehmen:"Coffe Cute", inhaber:"Jasmin Frees", standort:"7185", telefon:"4973169", leistungen:"Speisen und Getränkeverkauf"}
  ];

  const cardsEl = document.getElementById('cards');
  const filtersEl = document.getElementById('filters');
  const searchEl = document.getElementById('searchInput');
  const countEl = document.getElementById('count');
  const emptyEl = document.getElementById('emptyState');
  const totalEl = document.getElementById('totalCount');

  let activeBranche = 'Alle';

  const branchen = ['Alle', ...Array.from(new Set(data.map(d => d.branche))).sort()];
  branchen.forEach(b => {
    const btn = document.createElement('button');
    btn.textContent = b;
    if (b === 'Alle') btn.classList.add('active');
    btn.addEventListener('click', () => {
      activeBranche = b;
      document.querySelectorAll('.filters button').forEach(x => x.classList.remove('active'));
      btn.classList.add('active');
      render();
    });
    filtersEl.appendChild(btn);
  });

  function render(){
    const q = searchEl.value.trim().toLowerCase();
    const filtered = data.filter(d => {
      const matchesBranche = activeBranche === 'Alle' || d.branche === activeBranche;
      const matchesSearch = !q || [d.unternehmen, d.inhaber, d.standort, d.leistungen, d.branche].join(' ').toLowerCase().includes(q);
      return matchesBranche && matchesSearch;
    });

    cardsEl.innerHTML = '';
    filtered.forEach(d => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <span class="branche">${d.branche}</span>
        <h3>${d.unternehmen}</h3>
        <dl>
          <dt>Inhaber</dt><dd>${d.inhaber || '—'}</dd>
          <dt>Standort</dt><dd>${d.standort || '—'}</dd>
          ${d.telefon ? `<dt>Telefon</dt><dd>${d.telefon}</dd>` : ''}
        </dl>
        <div class="leistungen"><strong>Leistungen:</strong> ${d.leistungen}</div>
      `;
      cardsEl.appendChild(card);
    });

    countEl.textContent = `${filtered.length} von ${data.length} Unternehmen`;
    emptyEl.style.display = filtered.length === 0 ? 'block' : 'none';
    totalEl.textContent = `${data.length} eingetragene Unternehmen`;
  }

  searchEl.addEventListener('input', render);
  render();
</script>

</body>
</html>
